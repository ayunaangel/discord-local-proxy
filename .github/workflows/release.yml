name: Build e releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plataforma: linux
            artefato: DiscordProxy-Linux-x64
          - os: windows-latest
            plataforma: windows
            artefato: DiscordProxy-Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tk no Linux
        if: matrix.plataforma == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Ferramentas de build
        run: python -m pip install --upgrade ziglang pyinstaller

      - name: Compilar o componente nativo
        run: python build.py --target ${{ matrix.plataforma }}

      - name: Testes
        run: python -m unittest discover -s tests -t .

      - name: Empacotar
        run: python package.py --name ${{ matrix.artefato }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefato }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
      - uses: softprops/action-gh-release@v2
        with:
          files: artefatos/**/*
