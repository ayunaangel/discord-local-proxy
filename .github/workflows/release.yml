name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: DiscordLocalProxy-linux-x64
            package: release/DiscordLocalProxy-Linux-x64.tar.gz
          - os: windows-2022
            artifact: DiscordLocalProxy-windows-x64
            package: release/DiscordLocalProxy-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python build tools
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-linux.sh
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.package }}
          generate_release_notes: true
